# Site config for Nginx UI (host reverse proxy) -> vehicle-viewer container on 127.0.0.1:6666.
# If Nginx UI itself runs in a bridge-network container, 127.0.0.1 is that container:
# replace the upstream address as described in docs/DEPLOY.md.

upstream vehicle_viewer {
    server 127.0.0.1:6666;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vehicle.hoha.dev;

    # Step 1 (before a certificate exists): serve the app over HTTP so the domain can be checked.
    # Step 2 (after Nginx UI issues the certificate): replace this location with
    #     return 301 https://$host$request_uri;
    # Nginx UI adds its own /.well-known/acme-challenge location when requesting the certificate;
    # keep it above the redirect.
    location / {
        proxy_pass http://vehicle_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

