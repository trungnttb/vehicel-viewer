# Nginx UI site config for vehicle.hoha.dev. Full walkthrough: docs/DEPLOY.md section 5.

upstream vehicle_viewer {
    server 127.0.0.1:6666;          # Nginx UI in a bridge container: server vehicle-viewer:80;
    keepalive 16;
}

# HTTP only answers Let's Encrypt challenges (needed for auto-renewal); everything else goes to HTTPS.
# 9180 is Nginx UI's default HTTP-01 challenge port.
server {
    listen 80;
    listen [::]:80;
    server_name vehicle.hoha.dev;

    location /.well-known/acme-challenge {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:9180;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vehicle.hoha.dev;

    # Replace with the paths shown on Nginx UI's Certificates page.
    ssl_certificate     /etc/nginx/ssl/vehicle.hoha.dev/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/vehicle.hoha.dev/private.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Static app with no upload endpoints.
    client_max_body_size 1m;

    location / {
        proxy_pass http://vehicle_viewer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
