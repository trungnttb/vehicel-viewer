server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates at the host reverse proxy (Nginx UI); keep redirects relative
    # so they do not point at the container's http://host:80.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets, so a new build gets new file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Narration files keep stable names across builds; cache briefly so re-recorded audio shows up.
    location /audio/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html references the current asset hashes and must be revalidated on every load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
